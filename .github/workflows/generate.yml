name: Generate Snake Animation
on:
  schedule:
    - cron: "0 0 * * SUN"  # 每周日自动
  workflow_dispatch:  # 手动触发
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff6b00&color_dots=#0d1117,#631c03,#bd561d,#fa7a18,#fddf68
            dist/github-contribution-grid-snake.svg?color_snake=#ff6b00&color_dots=#ebedf0,#ffee4a,#ffc501,#fe9600,#fddf68
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Update snake animation - Halloween theme"
          git push
